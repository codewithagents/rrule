name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Minimal permissions: fork PRs have no secrets access by design with pull_request trigger
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Change detection: classify the PR as code-touching vs docs-only.
  # Tier 2 (coverage) gates on the `code` output so docs-only PRs skip it.
  # Tier 1 (ci) and the CI Gate always run.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.mdx'

  # ===========================================================================
  # TIER 1: always runs on both Node versions (polyfill path on 22, native on 26).
  # ===========================================================================
  ci:
    name: Build, Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

  # ===========================================================================
  # TIER 2: coverage. Gates on change detection; skipped on docs-only PRs.
  # ===========================================================================
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter rrule-ts run test:coverage

      - name: Upload coverage to Codecov (rrule-ts)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          use_oidc: true
          files: ./packages/rrule-ts/coverage/lcov.info
          flags: rrule-ts
          disable_search: true
          fail_ci_if_error: false

  # ===========================================================================
  # GATE AGGREGATOR: single stable required status check.
  # Always runs so it reports even when Tier 2 is skipped on docs-only PRs.
  # ===========================================================================
  gate:
    name: CI Gate
    needs:
      - changes
      - ci
      - coverage
    if: always()
    runs-on: ubuntu-latest
    steps:
      # The gate PASSES when every needed job is success or skipped.
      # `ci` always runs (Node 22+26 matrix, Tier 1) so it must be success — skipped
      # would mean it never ran, which is a gate failure.
      # `coverage` is Tier 2 and may be skipped on docs-only PRs, which is fine.
      - name: Verify all needed jobs passed or were legitimately skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "Needed job results:"
          echo "$RESULTS"
          if [ -z "$RESULTS" ] || [ "$RESULTS" = "null" ]; then
            echo "::error::CI Gate failed: needs results were empty or null."
            exit 1
          fi
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI Gate failed, the following needed jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "CI Gate passed: every needed job was success or skipped."
